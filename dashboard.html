<!DOCTYPE html>
<html>
<head>
    <title>JIRA Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .stat { background: #667eea; color: white; padding: 20px; border-radius: 5px; text-align: center; }
        .stat h3 { margin: 0; font-size: 14px; }
        .stat .value { font-size: 32px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #667eea; color: white; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .chart { background: #f8f9fa; padding: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>JIRA Dashboard</h1>
        <p style="margin-bottom: 20px;">
            <a href="jira_chat.html" target="_blank" style="color: #667eea; text-decoration: none; font-weight: bold;">
                [Chat] Open Chat Assistant - Ask questions about your Jira issues
            </a>
        </p>
        <div class="stats">
            <div class="stat"><h3>Total</h3><div class="value" id="total">0</div></div>
            <div class="stat"><h3>P1/P2</h3><div class="value" id="high">0</div></div>
            <div class="stat"><h3>60+ Days</h3><div class="value" id="old">0</div></div>
            <div class="stat"><h3>Avg Age</h3><div class="value" id="avg">0</div></div>
        </div>
        <div class="charts">
            <div class="chart"><canvas id="priorityChart"></canvas></div>
            <div class="chart"><canvas id="statusChart"></canvas></div>
        </div>
        <table>
            <thead><tr><th>Key</th><th>Summary</th><th>Priority</th><th>Status</th><th>Age</th></tr></thead>
            <tbody id="table"></tbody>
        </table>
    </div>
    <script>
        const data = [
    {
        "Key":  "UPD-2387",
        "Summary":  "UPD CSB26 Post Launch :: PREMIER EMEA T2 :: PLP - Missing  HMC Banner ",
        "Priority":  "P4 - Medium",
        "Status":  "Waiting for Dev",
        "Assignee":  "Shetty, Arpita R",
        "Age":  480
    },
    {
        "Key":  "UPD-2386",
        "Summary":  "UPD CSB26 Post Launch :: PREMIER EMEA T2 :: PLP - Missing HMC MFE CTA in Hero Banner  and ANAV",
        "Priority":  "P4 - Medium",
        "Status":  "Waiting for Dev",
        "Assignee":  "Shetty, Arpita R",
        "Age":  480
    },
    {
        "Key":  "MAV-810898",
        "Summary":  "MicroContentString collection : Latest Profile Tagging Wiped Out by Subsequent Untag Event Processing",
        "Priority":  "P4 - Medium",
        "Status":  "Proposed",
        "Assignee":  "Shetty, Arpita R",
        "Age":  14
    },
    {
        "Key":  "MAV-790788",
        "Summary":  "SPL Prod Std Offers :: SPL Disti Store - Std Offers PD Flyout not showing Warranty Duration for SPL Offers",
        "Priority":  "P3 - High",
        "Status":  "Defining Details",
        "Assignee":  "Shetty, Arpita R",
        "Age":  48
    },
    {
        "Key":  "MAV-789654",
        "Summary":  "US SNP offers missing in DP taxonomy",
        "Priority":  "P2 - Very High",
        "Status":  "Proposed",
        "Assignee":  "Shetty, Arpita R",
        "Age":  49
    },
    {
        "Key":  "MAV-788391",
        "Summary":  "ODW_1.0_INC# : Incorrect name + Missing image",
        "Priority":  "P4 - Medium",
        "Status":  "Proposed",
        "Assignee":  "Shetty, Arpita R",
        "Age":  51
    },
    {
        "Key":  "MAV-786117",
        "Summary":  "APD feature section content is missing",
        "Priority":  "P3 - High",
        "Status":  "In Development",
        "Assignee":  "Shetty, Arpita R",
        "Age":  54
    },
    {
        "Key":  "MAV-781007",
        "Summary":  "Gaming Monitors Category Incorrectly Displayed in Premier UX When No Eligible Offers Exist",
        "Priority":  "P2 - Very High",
        "Status":  "Proposed",
        "Assignee":  "Shetty, Arpita R",
        "Age":  60
    },
    {
        "Key":  "MAV-776383",
        "Summary":  "Need DSC to take and display offer name from CPQ",
        "Priority":  "P1 - Urgent",
        "Status":  "Waiting for Dev",
        "Assignee":  "Shetty, Arpita R",
        "Age":  68
    },
    {
        "Key":  "MAV-758705",
        "Summary":  "Offer Content Missing for Brazil (pt) Offers",
        "Priority":  "P4 - Medium",
        "Status":  "Proposed",
        "Assignee":  "Shetty, Arpita R",
        "Age":  94
    },
    {
        "Key":  "MAV-733431",
        "Summary":  "PROD: Datapipeline offer data - invalid property type",
        "Priority":  "P2 - Very High",
        "Status":  "Defining Details",
        "Assignee":  "Shetty, Arpita R",
        "Age":  116
    },
    {
        "Key":  "COEA-4443",
        "Summary":  "Content Needing To Be Marked Up As A List - Content that functions as a list should be indicated as such to screen reader users.",
        "Priority":  "P4 - Medium",
        "Status":  "Proposed",
        "Assignee":  "Shetty, Arpita R",
        "Age":  17
    },
    {
        "Key":  "COEA-4375",
        "Summary":  "Link Purpose Unclear To Screen Reader Users - Screen reader users need additional context to understand the purpose of the \"Learn more\" link.",
        "Priority":  "P2 - Very High",
        "Status":  "Proposed",
        "Assignee":  "Shetty, Arpita R",
        "Age":  17
    }
];
        document.getElementById('total').textContent = data.length;
        document.getElementById('high').textContent = data.filter(i => i.Priority.includes('P1') || i.Priority.includes('P2')).length;
        document.getElementById('old').textContent = data.filter(i => i.Age >= 60).length;
        const avgAge = data.reduce((a,b) => a + b.Age, 0) / data.length;
        document.getElementById('avg').textContent = Math.round(avgAge);
        
        const tbody = document.getElementById('table');
        data.forEach(i => {
            tbody.innerHTML += '<tr><td><a href="https://jira.dell.com/browse/'+i.Key+'">'+i.Key+'</a></td><td>'+i.Summary+'</td><td>'+i.Priority+'</td><td>'+i.Status+'</td><td>'+i.Age+'</td></tr>';
        });
        
        const priorityCounts = {};
        data.forEach(i => priorityCounts[i.Priority] = (priorityCounts[i.Priority] || 0) + 1);
        new Chart(document.getElementById('priorityChart'), {
            type: 'pie',
            data: { labels: Object.keys(priorityCounts), datasets: [{ data: Object.values(priorityCounts), backgroundColor: ['#ff6b6b','#ffa500','#ffd93d','#6bcb77','#4d96ff'] }] }
        });
        
        const statusCounts = {};
        data.forEach(i => statusCounts[i.Status] = (statusCounts[i.Status] || 0) + 1);
        new Chart(document.getElementById('statusChart'), {
            type: 'bar',
            data: { labels: Object.keys(statusCounts), datasets: [{ label: 'Issues', data: Object.values(statusCounts), backgroundColor: '#667eea' }] }
        });
    </script>
</body>
</html>
